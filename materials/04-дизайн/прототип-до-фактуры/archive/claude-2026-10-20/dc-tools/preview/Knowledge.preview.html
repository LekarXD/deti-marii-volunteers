  }

    return {
      phone: {
        segs: [
          { t: 'Скажи честно и тепло: ' },
          { t: '«У нас правило для всех взрослых — личные номера детям не даём»', hl: true },

          { doc: 'Ответы координаторов', q: 'Предложи передать открытку через координатора' }

      hug: {

      qaA: s.qaA,

      qaErr: s.qaErr,
      qaInvalid: s.qaErr ? 'true' : 'false',
      closeQa: () => this.setState({ qaOpen: false, qaErr: false }),
      publishQa: () => {

          seq: s.seq + 1, qaOpen: false, qaErr: false,

      sources: src.map((r) => ({

        art: r.art,
        isFile: r.icon === 'file', isAcademy: r.icon === 'academy', isMsg: r.icon === 'message', isBook: r.icon === 'book',

      ask: () => this.setState({ ranKey: this.keyOf(s.checkText), why: false }),
      hasAnswer: ran && !!res,

      segs: res ? res.segs.map((x) => ({ t: x.t, cls: x.hl ? 'hl' : '' })) : [],
      frags: res ? res.frags : [],

      whyLabel: s.why ? 'Скрыть фрагменты' : 'Откуда фрагменты',
