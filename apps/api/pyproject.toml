[project]
name = "opora-api"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["fastapi==0.115.12", "uvicorn[standard]==0.34.2", "SQLAlchemy==2.0.41", "greenlet==3.2.2", "psycopg[binary]==3.2.9", "alembic==1.16.1", "pydantic-settings==2.9.1", "cryptography==45.0.3", "pyotp==2.9.0", "Pillow==11.2.1", "openpyxl==3.1.5", "defusedxml==0.7.1", "pypdf==6.10.0", "PyJWT==2.15.1", "jsonschema==4.25.1", "reportlab==4.4.9", "PyMuPDF==1.25.1"]
[project.optional-dependencies]
test = ["pytest==8.3.5", "pytest-asyncio==0.26.0", "httpx==0.28.1"]
[project.scripts]
opora = "app.cli:main"
[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"
[tool.setuptools.packages.find]
include = ["app*"]
[tool.setuptools.package-data]
app = ["assets/fonts/*.ttf", "assets/fonts/LICENSE-*.txt"]
[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
