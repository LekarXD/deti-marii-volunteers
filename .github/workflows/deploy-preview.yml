name: deploy-preview
# Every push to main goes live at https://www.odschool.ru/deti-marii/ (infra/preview/deploy/README.md).
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: deploy-preview
  cancel-in-progress: false
env:
  PREVIEW_HOST: 5.42.116.162
  PREVIEW_URL: https://www.odschool.ru/deti-marii
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - name: Decide whether the live preview needs this commit
        id: live
        run: |
          live=$(curl -fsS --max-time 15 "$PREVIEW_URL/version.json" | python3 -c 'import json,sys; print(json.load(sys.stdin)["release"])' || true)
          echo "Live release: ${live:-unknown}"
          if [ -n "$live" ] && git cat-file -e "$live^{commit}" 2>/dev/null; then
            if git merge-base --is-ancestor "$GITHUB_SHA" "$live"; then
              echo "This commit is already contained in the live release."; echo "skip=true" >> "$GITHUB_OUTPUT"
            elif git merge-base --is-ancestor "$live" "$GITHUB_SHA" && git diff --quiet "$live" "$GITHUB_SHA" -- $(cat infra/preview/build-context-paths.txt); then
              echo "No deployable files changed since the live release."; echo "skip=true" >> "$GITHUB_OUTPUT"
            fi
          fi
      - if: steps.live.outputs.skip != 'true'
        uses: actions/setup-node@v4
        with: {node-version: '26'}
      - if: steps.live.outputs.skip != 'true'
        run: npm install --global pnpm@11.3.0 && pnpm install --frozen-lockfile
      - name: Build the web app for /deti-marii
        if: steps.live.outputs.skip != 'true'
        working-directory: apps/web
        run: node scripts/sync-studio-assets.mjs && pnpm exec tsc -b && VITE_APP_BASE_PATH=/deti-marii pnpm exec vite build
      - name: Bundle source and web build
        if: steps.live.outputs.skip != 'true'
        run: |
          bundle="$RUNNER_TEMP/bundle"; mkdir -p "$bundle/source"
          git archive --format=tar "$GITHUB_SHA" $(cat infra/preview/build-context-paths.txt) | tar -x -C "$bundle/source"
          cp -R apps/web/dist "$bundle/dist"
          tar -C "$bundle" -czf "$RUNNER_TEMP/bundle.tgz" source dist
          ls -lh "$RUNNER_TEMP/bundle.tgz"
      - name: Deploy to the preview host
        if: steps.live.outputs.skip != 'true'
        env:
          DEPLOY_KEY: ${{ secrets.PREVIEW_DEPLOY_KEY }}
          KNOWN_HOSTS: ${{ secrets.PREVIEW_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/preview_deploy && chmod 600 ~/.ssh/preview_deploy
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          ssh -i ~/.ssh/preview_deploy -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=yes -o ServerAliveInterval=30 \
            "root@$PREVIEW_HOST" "deploy $GITHUB_SHA" < "$RUNNER_TEMP/bundle.tgz"
      - name: Confirm the live release
        if: steps.live.outputs.skip != 'true'
        run: |
          live=$(curl -fsS --max-time 15 "$PREVIEW_URL/version.json" | python3 -c 'import json,sys; print(json.load(sys.stdin)["release"])')
          test "$live" = "$GITHUB_SHA" && echo "Live: $live"
