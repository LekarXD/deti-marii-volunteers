name: opora-ci
on: [push, pull_request]
permissions:
  contents: read
concurrency:
  group: opora-ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: opora
          POSTGRES_PASSWORD: ci-local-only
          POSTGRES_DB: opora_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U opora -d opora_test"
          --health-interval 3s --health-timeout 3s --health-retries 20
    env:
      OPORA_DATABASE_URL: postgresql+psycopg://opora:ci-local-only@127.0.0.1:5432/opora_test
      OPORA_ACTIVITIES_PERF_TEST_DATABASE_URL: postgresql+psycopg://opora:ci-local-only@127.0.0.1:5432/opora_activities_perf_test
      OPORA_TEST_DATABASE_URL: postgresql+psycopg://opora:ci-local-only@127.0.0.1:5432/opora_domain_test
      OPORA_LEARNING_TEST_DATABASE_URL: postgresql+psycopg://opora:ci-local-only@127.0.0.1:5432/opora_learning_test
      OPORA_PARTICIPANTS_TEST_DATABASE_URL: postgresql+psycopg://opora:ci-local-only@127.0.0.1:5432/opora_participants_test
      OPORA_CANDIDATES_TEST_DATABASE_URL: postgresql+psycopg://opora:ci-local-only@127.0.0.1:5432/opora_candidates_test
      OPORA_CRM_TEST_DATABASE_URL: postgresql+psycopg://opora:ci-local-only@127.0.0.1:5432/opora_crm_test
      OPORA_KNOWLEDGE_TEST_DATABASE_URL: postgresql+psycopg://opora:ci-local-only@127.0.0.1:5432/opora_knowledge_test
      OPORA_STUDIO_TEST_DATABASE_URL: postgresql+psycopg://opora:ci-local-only@127.0.0.1:5432/opora_studio_test
      OPORA_PROFILE_TEST_DATABASE_URL: postgresql+psycopg://opora:ci-local-only@127.0.0.1:5432/opora_profile_test
      OPORA_SIMULATOR_TEST_DATABASE_URL: postgresql+psycopg://opora:ci-local-only@127.0.0.1:5432/opora_simulator_test
      OPORA_REPORTING_TEST_DATABASE_URL: postgresql+psycopg://opora:ci-local-only@127.0.0.1:5432/opora_reporting_test
      OPORA_ADMIN_TEST_DATABASE_URL: postgresql+psycopg://opora:ci-local-only@127.0.0.1:5432/opora_admin_test
      OPORA_DOBRO_TEST_DATABASE_URL: postgresql+psycopg://opora:ci-local-only@127.0.0.1:5432/opora_dobro_test
      OPORA_TELEGRAM_TEST_DATABASE_URL: postgresql+psycopg://opora:ci-local-only@127.0.0.1:5432/opora_telegram_test
      OPORA_STAGE_DEMO_TEST_DATABASE_URL: postgresql+psycopg://opora:ci-local-only@127.0.0.1:5432/opora_stage
      OPORA_ASSET_ROOT: ${{ runner.temp }}/opora-private-test-assets
      OPORA_ENVIRONMENT: development
      PYTHONPATH: apps/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - uses: actions/setup-node@v4
        with: {node-version: '26'}
      - run: npm install --global pnpm@11.3.0
      - run: pnpm install --frozen-lockfile
      - run: python -m pip install -r apps/api/requirements.lock
      - run: python -m pip install --no-deps -e 'apps/api[test]'
      - name: Empty database migration and one Alembic head
        working-directory: apps/api
        run: |
          python -c 'from alembic.config import Config; from alembic.script import ScriptDirectory; assert len(ScriptDirectory.from_config(Config("alembic.ini")).get_heads()) == 1'
          alembic upgrade head
          alembic check
      - name: Provision isolated destructive-test databases
        run: python infra/scripts/prepare-test-dbs.py
      - run: pnpm typecheck && pnpm build && pnpm test
      - run: python -m pytest -p infra.pytest_gate -c apps/api/pyproject.toml apps/api tests/contract --ignore=apps/api/app/integrations/rtc/sidecar -q
      - name: Generated SDK drift
        run: sh infra/scripts/check-openapi.sh
      - name: Independent G1 against a fresh PostgreSQL database
        env:
          OPORA_DATABASE_URL: postgresql+psycopg://opora:ci-local-only@127.0.0.1:5432/opora_g1
        run: |
          python -c "import psycopg; c=psycopg.connect('postgresql://opora:ci-local-only@127.0.0.1:5432/postgres', autocommit=True); c.execute('CREATE DATABASE opora_g1'); c.close()"
          (cd apps/api && alembic upgrade head)
          sh infra/scripts/run-g1.sh
      - name: Isolated board sidecar tests
        run: |
          python -m venv "$RUNNER_TEMP/opora-board-venv"
          "$RUNNER_TEMP/opora-board-venv/bin/python" -m pip install -r apps/api/app/integrations/rtc/sidecar/requirements.txt 'pytest==8.3.5' 'pytest-asyncio==0.26.0'
          OPORA_SIDECAR_PYTHON="$RUNNER_TEMP/opora-board-venv/bin/python" sh infra/scripts/verify-sidecar.sh
