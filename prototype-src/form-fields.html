<sc-for list="{{fields}}" as="f"><div class="{{f.cls}}">
<sc-if value="{{f.isConsent}}"><label class="check a-consent"><input type="checkbox" checked="{{f.checked}}" onChange="{{f.toggle}}"><span>{{f.label}}<sc-if value="{{f.req}}"> <b class="a-req">*</b></sc-if></span></label></sc-if>
<sc-if value="{{f.notConsent}}"><span class="label">{{f.label}}<sc-if value="{{f.req}}"> <b class="a-req">*</b></sc-if><sc-if value="{{f.opt}}"> <span class="a-opt">по желанию</span></sc-if></span></sc-if>
<sc-if value="{{f.hasWhy}}"><p class="a-why">{{f.why}}</p></sc-if>
<sc-if value="{{f.isInput}}"><input class="input" type="{{f.inputType}}" value="{{f.value}}" placeholder="{{f.placeholder}}" autocomplete="{{f.autocomplete}}" aria-label="{{f.label}}" onChange="{{f.change}}" onFocus="{{f.focus}}" onBlur="{{f.blur}}"></sc-if>
<sc-if value="{{f.isTextarea}}"><textarea class="textarea a-textarea" value="{{f.value}}" aria-label="{{f.label}}" onChange="{{f.change}}"></textarea></sc-if>
<sc-if value="{{f.isSelect}}"><div class="chips a-chips" role="radiogroup" aria-label="{{f.label}}"><sc-for list="{{f.options}}" as="o"><button class="{{o.cls}}" role="radio" aria-checked="{{o.checked}}" onClick="{{o.toggle}}">{{o.label}}</button></sc-for></div></sc-if>
<sc-if value="{{f.isChoice}}"><div class="a-lines"><sc-for list="{{f.options}}" as="o"><label class="{{o.lineCls}}"><input type="{{f.choiceType}}" name="{{f.id}}" checked="{{o.checked}}" onChange="{{o.toggle}}"><span>{{o.label}}</span></label></sc-for></div></sc-if>
<sc-if value="{{f.isGroups}}"><div class="a-groups"><sc-for list="{{f.groups}}" as="g"><div class="a-group"><p class="eyebrow">{{g.title}}</p><sc-if value="{{g.hasNote}}"><p class="a-why">{{g.note}}</p></sc-if><sc-if value="{{g.hasOptions}}"><div class="a-lines"><sc-for list="{{g.options}}" as="o"><label class="{{o.lineCls}}"><input type="checkbox" checked="{{o.checked}}" onChange="{{o.toggle}}"><span>{{o.label}}</span></label></sc-for></div></sc-if></div></sc-for></div></sc-if>
<sc-if value="{{f.isChips}}"><div class="chips a-chips"><sc-for list="{{f.options}}" as="o"><button class="{{o.cls}}" aria-pressed="{{o.pressed}}" onClick="{{o.toggle}}">{{o.label}}</button></sc-for></div><sc-if value="{{f.hasOther}}"><input class="input" type="text" value="{{f.other}}" placeholder="Другое — через запятую" aria-label="Другие навыки" onChange="{{f.changeOther}}"></sc-if></sc-if>
<sc-if value="{{f.isGrid}}"><div class="a-grid"><span></span><sc-for list="{{f.cols}}" as="c"><span class="a-gh">{{c}}</span></sc-for><sc-for list="{{f.rows}}" as="r"><span class="a-gr">{{r.label}}</span><sc-for list="{{r.cells}}" as="c"><button class="{{c.cls}}" aria-pressed="{{c.pressed}}" aria-label="{{c.aria}}" onClick="{{c.toggle}}">✓</button></sc-for></sc-for></div></sc-if>
<sc-if value="{{f.isRoles}}"><div class="a-roles"><sc-for list="{{f.rgroups}}" as="g"><div class="{{g.cls}}"><button class="a-rhead" aria-expanded="{{g.open}}" onClick="{{g.toggle}}"><span class="a-rtitle"><b>{{g.title}}</b><sc-if value="{{g.hasHint}}"><small>{{g.hint}}</small></sc-if></span><span class="{{g.badgeCls}}">{{g.badge}}</span></button><sc-if value="{{g.open}}"><div class="chips a-rchips"><sc-for list="{{g.roles}}" as="o"><button class="{{o.cls}}" aria-pressed="{{o.pressed}}" onClick="{{o.toggle}}">{{o.label}}</button></sc-for></div></sc-if></div></sc-for><label class="check a-unsure"><input type="checkbox" checked="{{f.unsureOn}}" onChange="{{f.unsureToggle}}"><span>{{f.unsure}}</span></label></div></sc-if>
<sc-if value="{{f.hasWarn}}"><p class="a-warn">{{f.warn}}</p></sc-if>
<sc-if value="{{f.hasErr}}"><p class="err">{{f.err}}</p></sc-if>
</div></sc-for>
