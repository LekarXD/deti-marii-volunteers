<sc-if value="{{testIntro}}"><section class="card-hero a-reveal"><p class="lead">{{testText}}</p><div class="actions"><button class="btn btn-dark btn-lg" onClick="{{start}}">Начать</button></div></section></sc-if>
<sc-if value="{{testQuestion}}"><section class="card a-tq"><p class="eyebrow">Вопрос {{qNum}} из {{qTotal}}</p><h2 class="h2">{{qText}}</h2><div class="a-answers"><sc-for list="{{qOpts}}" as="o"><button class="{{o.cls}}" disabled="{{o.locked}}" onClick="{{o.pick}}">{{o.text}}</button></sc-for></div></section>
<sc-if value="{{answered}}"><div class="a-sheet" role="dialog" aria-modal="false" aria-label="Пояснение к ответу"><div class="{{sheetCls}}"><span class="a-sheet-ico" aria-hidden="true">{{sheetMark}}</span><h3 class="h3">{{explHead}}</h3><p>{{expl}}</p><button class="btn btn-dark btn-lg btn-block" onClick="{{nextQ}}">{{nextQLabel}}</button></div></div></sc-if></sc-if>
<sc-if value="{{testResult}}"><section class="card-hero a-reveal a-result"><div class="hero-grid"><div class="grow"><p class="eyebrow">Знакомство с фондом пройдено</p><h2 class="hero-title">{{scoreLine}}</h2><p class="lead">{{resultNext}}</p><div class="actions"><a class="btn btn-dark btn-lg" href="ApplicationStatus.dc.html">Перейти в личный кабинет</a><button class="btn btn-ghost" onClick="{{repeatTest}}">Пройти тест ещё раз</button></div></div><span class="hero-art" aria-hidden="true">ICON_SPARKLE</span></div></section></sc-if>
