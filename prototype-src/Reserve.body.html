<div class="head"><h1 class="h1">Проверка контактов</h1></div><section class="card-hero reserve-feature"><div class="hero-grid"><div class="hero-copy"><h2 class="hero-title">{{pendingTitle}}</h2><p class="lead">Перед приглашением уточните готовность и доступность человека.</p><sc-if value="{{hasUnchecked}}"><div class="actions"><button class="btn btn-primary btn-lg" onClick="{{openNext}}">Следующий контакт</button></div></sc-if></div><span class="hero-art" aria-hidden="true">ICON_PHONE</span></div></section><section class="section"><div class="section-head"><h2 class="h2">Контакты фонда</h2></div><div class="filters"><input class="input" aria-label="Поиск контакта" placeholder="Поиск по имени" value="{{query}}" onChange="{{search}}"><div class="chips"><sc-for list="{{filters}}" as="f"><button class="{{f.cls}}" onClick="{{f.pick}}">{{f.title}}</button></sc-for></div></div><div class="card"><sc-for list="{{people}}" as="p"><button class="row-button" onClick="{{p.pick}}"><span class="{{p.avatar}}">{{p.ini}}</span><span class="grow"><span class="h3">{{p.name}}</span><span class="meta" style="display:block">{{p.status}}</span></span><span>Проверить</span></button></sc-for><sc-if value="{{empty}}"><div class="empty"><h3 class="h3">В этой очереди никого нет</h3><button class="btn btn-secondary" onClick="{{reset}}">Показать все контакты</button></div></sc-if></div></section>
<sc-if value="{{hasSelected}}"><div class="p-overlay" onKeyDown="{{dialogKey}}"><section class="p-editor" role="dialog" aria-modal="true" aria-labelledby="reserve-title"><div class="p-editor-head"><h2 class="h2" id="reserve-title">{{person.name}}</h2><button class="iconbtn" aria-label="Закрыть контакт" autofocus="true" onClick="{{close}}">ICON_X</button></div><div class="p-editor-body"><div class="card"><p class="lead" style="margin-top:0">{{person.context}}</p><div class="field-grid" style="margin-top:24px"><div class="field"><label class="label" for="reserve-result">Результат связи</label><select class="select" id="reserve-result" value="{{result}}" onChange="{{changeResult}}"><option>Актуальность не проверена</option><option>Ждём ответа</option><option>Готов помогать</option><option>Сейчас на паузе</option><option>Не хочет получать приглашения</option></select></div><div class="field"><label class="label" for="reserve-time">Доступность</label><input class="input" id="reserve-time" value="{{availability}}" onChange="{{changeAvailability}}" placeholder="Когда и как может помогать"></div><div class="field field-wide"><label class="label" for="reserve-note">Заметка по разговору</label><textarea class="textarea" id="reserve-note" value="{{note}}" onChange="{{changeNote}}"></textarea></div></div><sc-if value="{{hasError}}"><p class="error" role="alert">{{error}}</p></sc-if></div></div><div class="p-editor-foot"><button class="btn btn-primary" onClick="{{save}}">Сохранить результат</button><button class="btn btn-ghost" onClick="{{close}}">Отмена</button></div></section></div></sc-if><sc-if value="{{saved}}"><p class="hint" role="status">Результат сохранён</p></sc-if>
