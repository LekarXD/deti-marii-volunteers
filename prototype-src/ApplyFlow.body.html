<div class="demo" role="group" aria-label="Состояния прототипа"><span class="demo-cap">Прототип:</span><button onClick="{{fillDemo}}">Заполнить примером</button><button onClick="{{clear}}">Очистить</button><!--VARIANTS--></div>
<div class="f-wrap" onKeyDown="{{key}}">
<div class="f-top"><sc-if value="{{canBack}}"><button class="btn btn-ghost btn-sm f-back" onClick="{{back}}">ICON_LEFT Назад</button></sc-if><span class="grow"></span><span class="meta num">{{counter}}</span></div>
<div class="bar f-bar" role="progressbar" aria-label="{{counter}}"><i style="{{barStyle}}"></i></div>
<section class="{{qCls}}" aria-live="polite"><p class="eyebrow f-chapter">{{chapter}}</p><h1 class="f-title">{{qTitle}}</h1><sc-if value="{{hasHint}}"><p class="lead f-hint">{{qHint}}</p></sc-if>
<div class="a-form f-form">
<!--FIELDS-->
</div>
<div class="f-actions"><button class="btn btn-primary btn-lg" onClick="{{next}}">{{nextLabel}}</button><sc-if value="{{showEnter}}"><span class="meta f-enter">или нажмите Enter ↵</span></sc-if></div>
<sc-if value="{{hasErrors}}"><p class="err" role="alert">Проверьте ответ.</p></sc-if>
</section>
</div>
