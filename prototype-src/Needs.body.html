<sc-if value="{{isList}}"><div class="head"><h1 class="h1">Возможности</h1><button class="btn btn-primary" onClick="{{create}}">Добавить возможность</button></div><section class="section"><div class="section-head"><h2 class="sr-only">Список возможностей</h2><a href="FundCatalog.dc.html">Как видит волонтёр</a></div><div class="filters"><label class="sr-only" for="role-search">Найти возможность</label><input class="input" id="role-search" placeholder="Найти по роли или программе" value="{{query}}" onChange="{{search}}"><div class="chips"><sc-for list="{{filters}}" as="f"><button class="{{f.cls}}" onClick="{{f.pick}}">{{f.title}}</button></sc-for></div></div><div class="card"><sc-for list="{{roles}}" as="r"><button class="row-button n-role" onClick="{{r.pick}}"><span class="{{r.art}}" aria-hidden="true">ICON_PALETTE</span><span class="grow"><span class="h3">{{r.title}}</span><span class="meta" style="display:block">{{r.program}}, {{r.regularity}}</span></span>ICON_RIGHT</button></sc-for><sc-if value="{{empty}}"><div class="empty"><h3 class="h3">Ничего не нашлось</h3><button class="btn btn-secondary" onClick="{{reset}}">Сбросить фильтры</button></div></sc-if><sc-if value="{{hasMore}}"><button class="btn btn-ghost" onClick="{{showAll}}">Все направления</button></sc-if></div></section></sc-if>
<sc-if value="{{isEdit}}"><div class="head"><h1 class="h1">{{draft.title}}</h1><div class="toolbar"><button class="btn btn-primary" onClick="{{save}}">Сохранить возможность</button><button class="btn btn-ghost" onClick="{{cancel}}">Отмена</button></div></div><sc-if value="{{hasError}}"><p class="error" role="alert">{{error}}</p></sc-if>
<section class="section"><div class="section-head"><h2 class="h2">Условия участия</h2></div><div class="card field-grid"><div class="field field-wide c-select" onKeyDown="{{roleKeys}}" onBlur="{{roleBlur}}"><label class="label" for="need-role">Роль волонтёра</label><button class="input c-trigger" id="need-role" aria-haspopup="listbox" aria-expanded="{{roleExpanded}}" onClick="{{toggleRoles}}"><span>{{roleName}}</span><span class="c-chevron"></span></button><sc-if value="{{roleOpen}}"><div class="c-role-menu"><label class="sr-only" for="need-role-search">Поиск роли</label><input class="input" id="need-role-search" placeholder="Найти роль" value="{{roleQuery}}" onChange="{{searchRole}}"><div class="c-options" role="listbox" aria-label="Роли волонтёров"><sc-for list="{{roleOptions}}" as="r"><button class="{{r.cls}}" role="option" aria-selected="{{r.selected}}" onClick="{{r.pick}}">{{r.title}}</button></sc-for></div><div class="c-menu-foot"><a href="Roles.dc.html">Добавить или изменить роль</a></div></div></sc-if></div><sc-for list="{{fields}}" as="f"><div class="{{f.cls}}"><label class="label" for="{{f.id}}">{{f.label}}</label><input class="input" id="{{f.id}}" value="{{f.value}}" type="{{f.type}}" onChange="{{f.change}}"></div></sc-for><div class="field field-wide"><label class="label" for="role-task">Что предстоит делать</label><textarea class="textarea" id="role-task" value="{{draft.task}}" onChange="{{changeTask}}"></textarea></div><div class="field"><label class="label" for="role-regularity">Регулярность</label><select class="select" id="role-regularity" value="{{draft.regularity}}" onChange="{{changeRegularity}}"><option>Регулярно</option><option>Периодически</option><option>Разово</option><option>По задачам</option></select></div><div class="field"><label class="label" for="role-status">Статус набора</label><select class="select" id="role-status" value="{{draft.status}}" onChange="{{changeStatus}}"><option>Черновик</option><option>На уточнении</option><option>Опубликовано</option><option>Закрыто</option></select></div></div></section>
<section class="section"><div class="section-head"><h2 class="h2">Подготовка к этой роли</h2></div><div class="card"><div class="field"><label class="label" for="role-prep">Материалы и договорённости</label><textarea class="textarea" id="role-prep" value="{{draft.prep}}" onChange="{{changePrep}}"></textarea></div><div style="margin-top:24px"><sc-for list="{{requirements}}" as="r"><label class="checkline"><input type="checkbox" checked="{{r.checked}}" onChange="{{r.toggle}}"><span>{{r.label}}</span></label></sc-for></div></div></section></sc-if>
<sc-if value="{{saved}}"><p class="hint" role="status">Изменения сохранены в прототипе</p></sc-if>
