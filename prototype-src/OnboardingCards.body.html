<div class="demo" role="group" aria-label="Состояния прототипа"><span class="demo-cap">Прототип:</span><button onClick="{{restart}}">Начать сначала</button><!--ONB_VARIANTS--></div>
<div class="c-wrap">
<div class="a-ohead"><p class="eyebrow">{{stepLabel}}</p><div class="a-seg" aria-hidden="true"><sc-for list="{{segs}}" as="sg"><i class="{{sg.cls}}"></i></sc-for></div></div>
<sc-if value="{{isModule}}"><div class="c-top"><h1 class="c-mod">{{modTitle}}</h1><span class="meta num">{{cardCount}}</span></div>
<div class="c-card card">
<!--ONB_BLOCKS-->
</div>
<div class="c-nav"><sc-if value="{{hasBack}}"><button class="btn btn-secondary btn-lg" onClick="{{back}}">ICON_LEFT</button></sc-if><button class="btn btn-primary btn-lg c-next" onClick="{{forward}}">{{nextLabel}}</button></div>
</sc-if>
<sc-if value="{{isTest}}"><h1 class="h1 a-modtitle">{{testTitle}}</h1>
<!--ONB_TEST-->
</sc-if>
</div>
