name: opora-local
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: opora
      POSTGRES_USER: opora
      POSTGRES_PASSWORD: ${OPORA_POSTGRES_PASSWORD:?set OPORA_POSTGRES_PASSWORD in infra/.env}
    ports: ["127.0.0.1:${OPORA_PG_PORT:-55647}:5432"]
    volumes: ["postgres-data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U opora -d opora"]
      interval: 3s
      timeout: 3s
      retries: 20
  migrate:
    build: {context: .., dockerfile: infra/docker/api.Dockerfile, labels: {org.opencontainers.image.revision: "${OPORA_RELEASE:-development}"}}
    command: ["alembic", "upgrade", "head"]
    environment: &api-environment
      OPORA_ENVIRONMENT: development
      OPORA_DATABASE_URL: postgresql+psycopg://opora:${OPORA_POSTGRES_PASSWORD}@postgres:5432/opora
      OPORA_TRUSTED_ORIGINS: '["http://localhost:8080","http://127.0.0.1:8080"]'
      OPORA_COOKIE_SECURE: "false"
      OPORA_RELEASE: ${OPORA_RELEASE:-development}
      OPORA_ASSET_ROOT: /var/lib/opora/assets
      OPORA_SECRET_KEY: ${OPORA_SECRET_KEY:-development-only-set-OPORA_SECRET_KEY}
      OPORA_DEV_INBOX: ${OPORA_DEV_INBOX:-true}
      OPORA_SMTP_HOST: ${OPORA_SMTP_HOST:-}
      OPORA_SMTP_PORT: ${OPORA_SMTP_PORT:-587}
      OPORA_SMTP_FROM: ${OPORA_SMTP_FROM:-}
      OPORA_SMTP_STARTTLS: ${OPORA_SMTP_STARTTLS:-true}
      OPORA_SMTP_USERNAME: ${OPORA_SMTP_USERNAME:-}
      OPORA_SMTP_PASSWORD: ${OPORA_SMTP_PASSWORD:-}
      OPORA_EMAIL_WEBHOOK_SECRET: ${OPORA_EMAIL_WEBHOOK_SECRET:-}
      OPORA_AI_BASE_URL: ${OPORA_AI_BASE_URL:-}
      OPORA_AI_API_KEY: ${OPORA_AI_API_KEY:-}
      OPORA_AI_MODEL: ${OPORA_AI_MODEL:-}
      OPORA_AI_TRANSCRIPTION_MODEL: ${OPORA_AI_TRANSCRIPTION_MODEL:-}
      OPORA_AI_ENABLED: ${OPORA_AI_ENABLED:-false}
      OPORA_RTC_URL: ${OPORA_RTC_URL:-}
      OPORA_RTC_PUBLIC_URL: ${OPORA_RTC_PUBLIC_URL:-}
      OPORA_RTC_API_KEY: ${OPORA_RTC_API_KEY:-}
      OPORA_RTC_API_SECRET: ${OPORA_RTC_API_SECRET:-}
      OPORA_RTC_DEPLOYMENT: ${OPORA_RTC_DEPLOYMENT:-self_hosted}
      OPORA_RTC_BOARD_URL: ${OPORA_RTC_BOARD_URL:-}
      OPORA_RTC_BOARD_SECRET: ${OPORA_RTC_BOARD_SECRET:-}
      OPORA_CAPTURE_ENABLED: ${OPORA_CAPTURE_ENABLED:-false}
      OPORA_CAPTURE_RENDERER_URL: ${OPORA_CAPTURE_RENDERER_URL:-}
    depends_on:
      postgres: {condition: service_healthy}
  api:
    build: {context: .., dockerfile: infra/docker/api.Dockerfile, labels: {org.opencontainers.image.revision: "${OPORA_RELEASE:-development}"}}
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8001", "--no-access-log"]
    environment:
      <<: *api-environment
      OPORA_TELEGRAM_LINK_ENABLED: ${OPORA_TELEGRAM_LINK_ENABLED:-false}
      OPORA_TELEGRAM_BOT_USERNAME: ${OPORA_TELEGRAM_BOT_USERNAME:-}
      OPORA_TELEGRAM_WEBHOOK_SECRET: ${OPORA_TELEGRAM_WEBHOOK_SECRET:-}
    ports: ["127.0.0.1:8001:8001"]
    volumes: ["asset-data:/var/lib/opora/assets"]
    depends_on:
      migrate: {condition: service_completed_successfully}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/ready',timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 20
  worker:
    stop_grace_period: 3m
    healthcheck:
      test: ["CMD", "python", "-m", "app.worker.runtime", "health"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 15s
    build: {context: .., dockerfile: infra/docker/api.Dockerfile, labels: {org.opencontainers.image.revision: "${OPORA_RELEASE:-development}"}}
    command: ["python", "-m", "app.worker.main", "--kind", "outbox.deliver"]
    environment: *api-environment
    volumes: ["asset-data:/var/lib/opora/assets"]
    depends_on:
      migrate: {condition: service_completed_successfully}
  io-worker:
    stop_grace_period: 3m
    healthcheck:
      test: ["CMD", "python", "-m", "app.worker.runtime", "health"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 15s
    build: {context: .., dockerfile: infra/docker/api.Dockerfile, labels: {org.opencontainers.image.revision: "${OPORA_RELEASE:-development}"}}
    command: ["python", "-m", "app.worker.main", "--kind", "studio.close", "--kind", "studio.revoke", "--kind", "studio.reconcile_participant", "--kind", "knowledge.index", "--kind", "knowledge.ingest", "--kind", "ai.generate", "--kind", "reporting.digest"]
    environment: *api-environment
    volumes: ["asset-data:/var/lib/opora/assets"]
    depends_on:
      migrate: {condition: service_completed_successfully}
  web:
    build: {context: .., dockerfile: infra/docker/web.Dockerfile, labels: {org.opencontainers.image.revision: "${OPORA_RELEASE:-development}"}}
    ports: ["127.0.0.1:8080:8080"]
    depends_on:
      api: {condition: service_healthy}
  inbox:
    image: axllent/mailpit:v1.21
    profiles: [delivery-dev]
    ports: ["127.0.0.1:8025:8025", "127.0.0.1:1025:1025"]
volumes:
  postgres-data:
  asset-data:
