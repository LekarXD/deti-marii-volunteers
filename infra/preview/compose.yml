name: opora-preview
x-api-environment: &api-environment
  OPORA_ENVIRONMENT: staging
  OPORA_DATABASE_URL: postgresql+psycopg://opora_stage:${OPORA_STAGE_DB_PASSWORD:?private stage password}@postgres:5432/opora_stage
  OPORA_RELEASE: ${OPORA_RELEASE:?full pushed source SHA required}
  OPORA_APP_MOUNT_PREFIX: /deti-marii
  OPORA_COOKIE_SECURE: "true"
  OPORA_DEV_INBOX: "false"
  OPORA_TRUSTED_ORIGINS: '["https://www.odschool.ru"]'
  OPORA_SECRET_KEY: ${OPORA_SECRET_KEY:?private stage encryption key}
  OPORA_FOUNDATION_ID: ${OPORA_FOUNDATION_ID:?fictitious stage foundation}
  OPORA_ASSET_ROOT: /var/lib/opora/assets
  OPORA_RTC_URL: https://www.odschool.ru/deti-marii/rtc
  OPORA_RTC_PUBLIC_URL: wss://www.odschool.ru/deti-marii/rtc
  OPORA_RTC_API_KEY: ${OPORA_RTC_API_KEY:?private stage RTC key}
  OPORA_RTC_API_SECRET: ${OPORA_RTC_API_SECRET:?private stage RTC secret}
  OPORA_RTC_DEPLOYMENT: self_hosted
  OPORA_RTC_BOARD_URL: wss://www.odschool.ru/deti-marii/board
  OPORA_RTC_BOARD_SECRET: ${OPORA_RTC_BOARD_SECRET:?private stage board secret}
  OPORA_CAPTURE_ENABLED: ${OPORA_CAPTURE_ENABLED:-false}
  OPORA_CAPTURE_RENDERER_URL: https://www.odschool.ru/deti-marii/recorder.html
  OPORA_AI_ENABLED: "false"
x-api: &api
  image: opora-preview/api:${OPORA_RELEASE:?}
  init: true
  read_only: true
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  tmpfs: ["/tmp:rw,nosuid,nodev,size=134217728,mode=1777"]
  environment: *api-environment
  volumes: ["assets:/var/lib/opora/assets"]
  networks: [private, egress]
  restart: unless-stopped
  mem_limit: 256m
  cpus: 0.5
  pids_limit: 96
x-worker-health: &worker-health
  test: [CMD, python, -m, app.worker.runtime, health]
  interval: 10s
  timeout: 3s
  retries: 3
  start_period: 15s
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: opora_stage
      POSTGRES_USER: opora_stage
      POSTGRES_PASSWORD: ${OPORA_STAGE_DB_PASSWORD:?}
    volumes: ["pg-data:/var/lib/postgresql/data"]
    networks: [private]
    restart: unless-stopped
    mem_limit: 256m
    cpus: 0.5
    pids_limit: 64
    shm_size: 64m
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U opora_stage -d opora_stage"]
      interval: 5s
      timeout: 3s
      retries: 20
  migrate:
    <<: *api
    restart: "no"
    command: [alembic, upgrade, head]
    depends_on:
      postgres: {condition: service_healthy}
  api:
    <<: *api
    volumes: ["assets:/var/lib/opora/assets", "${OPORA_STAGE_PRIVATE_DIR:?}/demo:/run/opora-private"]
    command: [uvicorn, app.main:app, --host, 0.0.0.0, --port, "8001", --root-path, /deti-marii, --no-access-log]
    depends_on:
      migrate: {condition: service_completed_successfully}
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/ready',timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 15s
  outbox:
    <<: *api
    command: [python, -m, app.worker.main, --kind, outbox.deliver]
    mem_limit: 128m
    cpus: 0.2
    stop_grace_period: 3m
    healthcheck: *worker-health
    depends_on:
      migrate: {condition: service_completed_successfully}
  io:
    <<: *api
    command: [python, -m, app.worker.main, --kind, studio.close, --kind, studio.revoke, --kind, studio.reconcile_participant, --kind, knowledge.index, --kind, knowledge.ingest, --kind, ai.generate, --kind, reporting.digest, --kind, followups.rules, --kind, dobro.reminders.scan]
    mem_limit: 192m
    cpus: 0.3
    stop_grace_period: 3m
    healthcheck: *worker-health
    depends_on:
      migrate: {condition: service_completed_successfully}
  web:
    image: opora-preview/web:${OPORA_RELEASE:?}
    init: true
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs: ["/tmp:rw,nosuid,nodev,size=67108864,mode=1777"]
    volumes: ["./nginx.conf:/etc/nginx/nginx.conf:ro"]
    ports: ["127.0.0.1:18081:8080"]
    networks:
      private:
      gateway:
        aliases: [opora-preview-web]
    restart: unless-stopped
    mem_limit: 64m
    cpus: 0.2
    pids_limit: 32
    depends_on:
      api: {condition: service_healthy}
  livekit:
    image: livekit/livekit-server:v1.9.12
    command: [--config, /etc/opora/livekit.yaml]
    volumes: ["${OPORA_STAGE_PRIVATE_DIR:?private stage directory}/livekit.yaml:/etc/opora/livekit.yaml:ro"]
    user: "10001:10001"
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs: ["/tmp:rw,nosuid,nodev,size=33554432,mode=1777"]
    networks: [private, egress]
    ports: ["18084:18084/udp", "18085:18085/tcp"]
    restart: unless-stopped
    mem_limit: 192m
    cpus: 0.3
    pids_limit: 48
  board:
    image: opora-preview/board:${OPORA_RELEASE:?}
    init: true
    user: "10001:10001"
    command: [python, -m, app.integrations.rtc.sidecar, --host, 0.0.0.0, --port, "7881"]
    environment:
      OPORA_RTC_BOARD_SECRET: ${OPORA_RTC_BOARD_SECRET:?}
      OPORA_RTC_BOARD_AUTH_URL: http://api:8001/api/v1/studio-board/authorize
      OPORA_RTC_BOARD_DATA_DIR: /var/lib/opora/board
    volumes: ["board-data:/var/lib/opora/board"]
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs: ["/tmp:rw,nosuid,nodev,size=33554432,mode=1777"]
    networks: [private]
    restart: unless-stopped
    mem_limit: 96m
    cpus: 0.2
    pids_limit: 48
    depends_on:
      api: {condition: service_healthy}
  media:
    image: opora-preview/media:${OPORA_RELEASE:?}
    profiles: [media]
    init: true
    user: "10001:10001"
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true, "seccomp=../docker/media-seccomp-sandbox.json"]
    shm_size: 512m
    tmpfs:
      - /tmp:rw,nosuid,nodev,size=1073741824,mode=1777
      - /home/opora:rw,nosuid,nodev,size=67108864,uid=10001,gid=10001,mode=0700
    environment: *api-environment
    volumes: ["assets:/var/lib/opora/assets"]
    networks: [private, egress]
    restart: unless-stopped
    mem_limit: 2g
    cpus: 1.5
    pids_limit: 256
    stop_grace_period: 30m
    healthcheck: *worker-health
    depends_on:
      api: {condition: service_healthy}
networks:
  private: {internal: true}
  egress:
  gateway:
    external: true
    name: curator-bot_default
volumes:
  pg-data:
  assets:
  board-data:
