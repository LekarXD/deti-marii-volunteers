pid /tmp/nginx.pid;
events { worker_connections 256; }
http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  access_log off;
  error_log /dev/null;
  client_body_temp_path /tmp/client_body;
  proxy_temp_path /tmp/proxy;
  fastcgi_temp_path /tmp/fastcgi;
  uwsgi_temp_path /tmp/uwsgi;
  scgi_temp_path /tmp/scgi;
  map $http_upgrade $connection_upgrade { default upgrade; '' close; }
  server {
    listen 8080;
    server_tokens off;
    root /usr/share/nginx/html;
    client_max_body_size 2m;
    add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    location = /version.json { proxy_pass http://api:8001/version.json; proxy_set_header Host $http_host; }
    location = /health { proxy_pass http://api:8001/health; }
    location = /ready { proxy_pass http://api:8001/ready; }
    location /api/ {
      proxy_buffering off;
      proxy_pass http://api:8001;
      proxy_set_header Host $http_host;
      proxy_set_header X-Forwarded-Proto https;
      proxy_set_header X-Forwarded-Prefix /deti-marii;
    }
    location /rtc/ {
      proxy_pass http://livekit:7880/;
      proxy_http_version 1.1;
      proxy_set_header Host $http_host;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_read_timeout 1800s;
    }
    location = /rtc { proxy_pass http://livekit:7880/; }
    location /board/ {
      proxy_pass http://board:7881;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_read_timeout 1800s;
    }
    location / { try_files $uri $uri/ /index.html; }
  }
}
